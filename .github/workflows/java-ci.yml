name: Java quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, test and static analysis
        run: ./mvnw -B -ntp clean verify
      - name: Install verified Gitleaks binary
        shell: bash
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan tracked source for secrets
        run: python3 scripts/quality/check-staged.py --secrets-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-reports
          path: |
            **/target/surefire-reports/
            **/target/pmd.xml
            **/target/spotbugsXml.xml
          retention-days: 7

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Audit dependencies (CVSS >= 7 fails)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          test -n "$NVD_API_KEY" || { echo 'Configure the NVD_API_KEY repository secret to run this required audit.'; exit 1; }
          ./mvnw -B -ntp -DskipTests -Pdependency-audit package dependency-check:aggregate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-reports
          path: target/dependency-check-report.*
          retention-days: 7
