# OryxOS 默认配置
oryxos:
  # 工作区根目录（可通过 -Doryxos.home=/path 覆盖）
  home: .oryxos

spring:
  application:
    name: oryxos
  main:
    banner-mode: off
  threads:
    virtual:
      # Java 21 virtual thread：同步阻塞模型下支撑高并发
      enabled: true
  datasource:
    # SQLite 嵌入式数据库，落在工作区目录下
    url: jdbc:sqlite:${oryxos.home}/oryxos.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    hibernate:
      # 表结构由手工维护的建表脚本管理，不依赖 Hibernate 自动演进
      ddl-auto: none

server:
  port: 8080
  tomcat:
    # 连接等待不等同于 Agent 执行期限；同步业务超时由业务调用链负责。
    connection-timeout: 10s
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  server:
    address: 127.0.0.1
    port: ${ORYXOS_MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# 文档只在显式 local-docs 配置下启用。
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  paths-to-match: /api/v1/**

# 持久化异常仅由安全边界报告；底层 SQL 异常可能带原始参数，禁止直接透出。
logging:
  pattern:
    level: '%5p [traceId=%X{traceId:-}]'
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.springframework.web.client: OFF
