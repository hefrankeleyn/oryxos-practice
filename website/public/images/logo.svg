<svg xmlns="http://www.w3.org/2000/svg" width="480" height="128" viewBox="0 0 480 128" role="img" aria-label="OryxOS">
  <title>OryxOS</title>
  <defs>
    <linearGradient id="oryx-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="oryx-os" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <style>
      .word { fill: #0F172A; }
      .tag  { fill: #64748B; }
      @media (prefers-color-scheme: dark) {
        .word { fill: #F1F5F9; }
        .tag  { fill: #94A3B8; }
      }
    </style>
  </defs>

  <!-- ===== 图形标：六边形（OS / 节点）+ 羚羊头（长直双角） ===== -->
  <g transform="translate(4 4)">
    <!-- 六边形底板，圆角通过同色描边实现 -->
    <polygon points="60,8 105,34 105,86 60,112 15,86 15,34"
             fill="url(#oryx-bg)" stroke="url(#oryx-bg)" stroke-width="10" stroke-linejoin="round"/>
    <!-- 双角：细长、锥形、微微外张 -->
    <polygon points="49.5,55 38.5,22 41.5,21 56,52" fill="#FFFFFF"/>
    <polygon points="70.5,55 81.5,22 78.5,21 64,52" fill="#FFFFFF"/>
    <!-- 耳朵 -->
    <path d="M49,58 Q38,55 33,61 Q41,64 50,63 Z" fill="#FFFFFF"/>
    <path d="M71,58 Q82,55 87,61 Q79,64 70,63 Z" fill="#FFFFFF"/>
    <!-- 头部：上宽下窄，收成吻部 -->
    <path d="M47,53 Q60,47 73,53 L67.5,86 Q60,97 52.5,86 Z" fill="#FFFFFF"/>
    <!-- 面部斑纹（大羚羊标志性的深色面纹，兼作眼睛） -->
    <path d="M52,62 Q54.5,61 56,63.5 L57.2,80 Q56,82 54.6,80 Z" fill="#5B21B6"/>
    <path d="M68,62 Q65.5,61 64,63.5 L62.8,80 Q64,82 65.4,80 Z" fill="#5B21B6"/>
    <!-- 鼻梁高光 -->
    <circle cx="60" cy="89" r="2.2" fill="#5B21B6"/>
  </g>

  <!-- ===== 文字标 ===== -->
  <text x="146" y="74" font-family="'Inter','SF Pro Display','PingFang SC','Helvetica Neue',Arial,sans-serif"
        font-size="58" font-weight="800" letter-spacing="-1.5">
    <tspan class="word">Oryx</tspan><tspan fill="url(#oryx-os)">OS</tspan>
  </text>
  <text x="149" y="104" class="tag" font-family="'Inter','SF Pro Text','PingFang SC','Helvetica Neue',Arial,sans-serif"
        font-size="15" font-weight="500" letter-spacing="2.7">AGENT HARNESS OS</text>
</svg>
