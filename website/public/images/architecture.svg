<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title description">
  <title id="title">OryxOS 目标逻辑架构 / Target logical architecture</title>
  <desc id="description">CLI、REST API 和定时任务统一调用 AgentService。自实现 ReActLoop 组装文件与记忆上下文，调用显式映射的 Provider，必要时由 ToolExecutor 校验并执行工具，回填结果继续推理。每次模型和工具调用，包括失败与拒绝，都将审计写入 SQLite。图中业务组件尚未实现；这是目标调用关系，不是 Maven 依赖图。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="m1 1 6 3-6 3" fill="none" stroke="#8B7C9D" stroke-width="1.4"/></marker>
    <marker id="memory-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m1 1 6 3-6 3" fill="none" stroke="#7A9A87" stroke-width="1.4"/></marker>
    <style>
      text { font-family: 'Avenir Next', 'Trebuchet MS', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #292536; }
      .heading { font-size: 22px; font-weight: 600; }
      .name { font-size: 20px; font-weight: 600; }
      .body { font-size: 16px; fill: #625D6B; }
      .small { font-size: 14px; fill: #6E617C; }
      .mono { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 15px; fill: #65547C; }
      .flow { fill: none; stroke: #8B7C9D; stroke-width: 1.7; stroke-linejoin: round; marker-end: url(#arrow); }
      .outline { stroke: #D5CDDF; stroke-width: 1.2; }
    </style>
  </defs>
  <rect width="1440" height="1040" fill="#FFFFFF"/>
  <text x="48" y="57" font-size="32" font-weight="600" letter-spacing="-1">OryxOS</text>
  <text x="218" y="55" class="heading">目标逻辑架构 / Target architecture</text>
  <text x="48" y="87" class="body">一个目录定义一个 Agent；一个底座提供共享执行环境。</text>
  <rect x="1094" y="30" width="298" height="44" rx="8" fill="#E4DFF1"/>
  <text x="1243" y="57" text-anchor="middle" font-size="15" fill="#6650B8">Runtime MVP · In development</text>

  <!-- 三个触发来源不建立三套执行链路 -->
  <rect x="404" y="119" width="190" height="64" rx="9" fill="#F4F5F2" class="outline"/>
  <rect x="614" y="119" width="190" height="64" rx="9" fill="#F4F5F2" class="outline"/>
  <rect x="824" y="119" width="190" height="64" rx="9" fill="#F4F5F2" class="outline"/>
  <text x="499" y="146" class="name" text-anchor="middle">CLI Channel</text>
  <text x="499" y="168" class="small" text-anchor="middle">终端 / Terminal</text>
  <text x="709" y="146" class="name" text-anchor="middle">REST API</text>
  <text x="709" y="168" class="small" text-anchor="middle">业务系统 / Applications</text>
  <text x="919" y="146" class="name" text-anchor="middle">AgentScheduler</text>
  <text x="919" y="168" class="small" text-anchor="middle">定时任务 / Schedules</text>
  <path d="M499 183v18h420v-18" fill="none" stroke="#8B7C9D" stroke-width="1.7"/>

  <!-- 文件工作区：Skill 与 Agent 定义属于上下文，不注册为 Tool -->
  <rect x="48" y="214" width="288" height="540" rx="14" fill="#F0F6F2" stroke="#BCD1C4" stroke-width="1.2"/>
  <text x="72" y="249" class="heading">Agent 工作区</text>
  <text x="72" y="276" class="small">File-based definitions &amp; context</text>
  <rect x="72" y="304" width="240" height="120" rx="8" fill="#FFFFFF" stroke="#CDDCD3"/>
  <text x="92" y="336" class="name">AGENT.md</text>
  <text x="92" y="364" class="body">frontmatter 派生 Profile</text>
  <text x="92" y="389" class="body">正文定义任务与行为</text>
  <text x="92" y="412" class="small">AgentLoader / ContextLoader</text>
  <rect x="72" y="442" width="240" height="116" rx="8" fill="#FFFFFF" stroke="#CDDCD3"/>
  <text x="92" y="474" class="name">skills/&lt;name&gt;</text>
  <text x="92" y="501" class="body">名称、描述、读取路径</text>
  <text x="92" y="526" class="body">正文由 read_file 按需读取</text>
  <text x="92" y="548" class="small">Context, not a Tool</text>
  <rect x="72" y="576" width="240" height="114" rx="8" fill="#FFFFFF" stroke="#CDDCD3"/>
  <text x="92" y="608" class="name">Bootstrap / Config</text>
  <text x="92" y="636" class="body">共享规则与运行配置</text>
  <text x="92" y="661" class="body">凭证仅从环境注入</text>
  <text x="92" y="683" class="mono">${ENV_VAR}</text>
  <text x="72" y="726" class="small">任务写在文件中，运行机制在底座。</text>

  <!-- 单机 JVM 逻辑边界；不是 core 的编译依赖 -->
  <rect x="364" y="214" width="692" height="604" rx="14" fill="#FCFBFE" stroke="#BAAECF" stroke-width="1.3"/>
  <text x="388" y="249" class="heading">单机运行时 / JVM runtime</text>
  <text x="1032" y="249" class="small" text-anchor="end">同步执行 · Virtual threads</text>
  <rect x="404" y="269" width="612" height="72" rx="9" fill="#292536"/>
  <text x="428" y="300" font-size="20" font-weight="600" style="fill:#FFFFFF">AgentService</text>
  <text x="428" y="323" font-size="14" style="fill:#CFC7DE">统一入口 / One entry point</text>
  <text x="991" y="312" class="mono" text-anchor="end" style="fill:#E4DFF1">process(Session, message)</text>
  <path d="M710 341v27" class="flow"/>

  <rect x="388" y="368" width="644" height="356" rx="11" fill="#F2EEF8" stroke="#D6CCE6"/>
  <text x="411" y="400" class="name">ReActLoop</text>
  <text x="540" y="400" class="small">自实现循环 / Own the loop</text>
  <text x="1005" y="400" class="small" text-anchor="end">SDK 不自动执行工具</text>
  <rect x="411" y="429" width="249" height="80" rx="8" fill="#FFFFFF" class="outline"/>
  <text x="431" y="461" class="name">PromptBuilder</text>
  <text x="431" y="488" class="body">文件 + 记忆 + 历史 + 工具</text>
  <rect x="745" y="429" width="260" height="80" rx="8" fill="#FFFFFF" class="outline"/>
  <text x="765" y="461" class="name">ProviderService</text>
  <text x="765" y="488" class="mono">provider name → ChatModel</text>
  <path d="M660 469h85" class="flow"/>
  <path d="M875 509v26H535v39" class="flow"/>
  <text x="548" y="554" class="small">无工具请求 / Final answer</text>
  <path d="M875 535v39" class="flow"/>
  <text x="889" y="556" class="small">Tool call</text>
  <rect x="411" y="574" width="249" height="107" rx="8" fill="#FFFFFF" class="outline"/>
  <text x="431" y="608" class="name">最终响应 / Response</text>
  <text x="431" y="638" class="body">输出结果或终止本轮</text>
  <text x="431" y="663" class="small">受最大迭代次数约束</text>
  <rect x="745" y="574" width="260" height="107" rx="8" fill="#E4DFF1" stroke="#BAAAD3"/>
  <text x="765" y="608" class="name">ToolExecutor</text>
  <text x="765" y="638" class="body">Registry → Sandbox → 执行</text>
  <text x="765" y="663" class="small">统一 OryxTool · 失败也审计</text>
  <path d="M875 681v23H700V488h-40" class="flow"/>
  <text x="720" y="718" class="small">结果回填 / Next turn</text>

  <rect x="404" y="741" width="612" height="56" rx="8" fill="#FFFFFF" stroke="#BAAECF" stroke-dasharray="5 4"/>
  <text x="428" y="765" class="name">调用审计 / Audit</text>
  <text x="990" y="765" class="mono" text-anchor="end">llm_calls + tool_invocations</text>
  <text x="428" y="786" class="small">每次调用，包括失败与拒绝 / Every call, including failures</text>

  <!-- 外部模型请求不被宣传成默认不出域；Sandbox 是工具动作边界 -->
  <rect x="1084" y="214" width="308" height="604" rx="14" fill="#F7F7F4" stroke="#D7D5DE" stroke-dasharray="6 5"/>
  <text x="1108" y="249" class="heading">外部资源 / Outside JVM</text>
  <text x="1108" y="277" class="small">访问边界由实际配置决定</text>
  <rect x="1105" y="404" width="264" height="114" rx="8" fill="#FFFFFF" class="outline"/>
  <text x="1125" y="439" class="name">LLM Providers</text>
  <text x="1125" y="467" class="body">云端模型 / 本地推理</text>
  <text x="1125" y="493" class="small">Cloud requests leave the host</text>
  <path d="M1005 469h100" class="flow" marker-start="url(#arrow)"/>
  <rect x="1105" y="574" width="264" height="107" rx="8" fill="#FFFFFF" class="outline"/>
  <text x="1125" y="608" class="name">MCP / Tools / Notify</text>
  <text x="1125" y="638" class="body">外部服务、文件与命令</text>
  <text x="1125" y="663" class="small">按工具动作校验白名单</text>
  <path d="M1005 627h100" class="flow"/>
  <text x="1108" y="736" class="small">应用层白名单 ≠ 强隔离沙箱</text>
  <text x="1108" y="762" class="small">Allow-list ≠ untrusted-code isolation</text>

  <!-- 记忆门面和持久化，均属于核心阶段目标 -->
  <rect x="48" y="854" width="440" height="118" rx="10" fill="#F0F6F2" stroke="#BCD1C4"/>
  <text x="72" y="887" class="name">MemoryService</text>
  <text x="72" y="917" class="body">SessionManager → SQLite</text>
  <text x="72" y="944" class="body">MarkdownMemoryStore → MEMORY.md</text>
  <path d="M268 854v-27h84V491h59" fill="none" stroke="#7A9A87" stroke-width="1.7" marker-end="url(#memory-arrow)"/>
  <rect x="526" y="854" width="530" height="118" rx="10" fill="#F7F5FA" class="outline"/>
  <text x="550" y="887" class="name">SQLite / 持久化</text>
  <text x="550" y="917" class="body">会话 · LLM / Tool 审计 · 调度记录 · 通知渠道</text>
  <text x="550" y="944" class="small">显式建表脚本 / Explicit schema · ddl-auto: none</text>
  <path d="M488 914h38" class="flow"/>
  <path d="M875 797v57" class="flow"/>
  <rect x="1105" y="854" width="264" height="118" rx="10" fill="#FFFFFF" stroke="#D7D5DE" stroke-dasharray="5 4"/>
  <text x="1125" y="887" class="name">扩展阶段 / Later</text>
  <text x="1125" y="917" class="body">多租户 / 分布式 / A2A</text>
  <text x="1125" y="944" class="small">不属于当前核心阶段</text>
  <!-- 跨容器连接最后绘制，避免被进程边界的填色遮挡。 -->
  <path d="M709 183v86" class="flow"/>
  <path d="M336 461h75" class="flow"/>
  <text x="48" y="1015" class="body">调用关系示意，非 Maven 依赖；图中业务组件均为目标设计。 / Target design, not module dependencies.</text>
</svg>
