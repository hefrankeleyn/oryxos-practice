<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrExt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97706"/>
    </marker>
    <style>
      .t   { font-size: 15px; font-weight: 600; fill: #0F172A; }
      .s   { font-size: 12px; fill: #475569; }
      .tw  { font-size: 15px; font-weight: 600; fill: #FFFFFF; }
      .sw  { font-size: 12px; fill: #CBD5E1; }
      .lbl { font-size: 14px; font-weight: 700; }
      .lbs { font-size: 11px; fill: #64748B; }
      .ln    { stroke: #475569; stroke-width: 1.6; fill: none; }
      .lnExt { stroke: #D97706; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
    </style>
  </defs>

  <rect width="1200" height="920" fill="#FFFFFF"/>

  <!-- ==================== 外部触发者 ==================== -->
  <g text-anchor="middle">
    <rect x="215" y="28" width="140" height="34" rx="17" fill="#F8FAFC" stroke="#94A3B8"/>
    <text x="285" y="50" class="s">开发者 / 运维</text>
    <rect x="475" y="28" width="140" height="34" rx="17" fill="#F8FAFC" stroke="#94A3B8"/>
    <text x="545" y="50" class="s">业务系统</text>
    <rect x="735" y="28" width="140" height="34" rx="17" fill="#F8FAFC" stroke="#94A3B8"/>
    <text x="805" y="50" class="s">定时规则</text>
  </g>

  <!-- ==================== OryxOS 进程边界 ==================== -->
  <rect x="20" y="90" width="920" height="770" rx="16" fill="none" stroke="#0F172A" stroke-width="1.4" stroke-dasharray="8 5"/>
  <rect x="34" y="81" width="178" height="18" fill="#FFFFFF"/>
  <text x="123" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">OryxOS · 单进程 / 单 JAR</text>

  <!-- ==================== 接入层 ==================== -->
  <rect x="35" y="110" width="890" height="90" rx="12" fill="#EFF6FF"/>
  <text x="95" y="151" text-anchor="middle" class="lbl" fill="#1D4ED8">接入层</text>
  <text x="95" y="170" text-anchor="middle" class="lbs">人推 + 钟推</text>
  <g text-anchor="middle">
    <rect x="180" y="125" width="210" height="60" rx="9" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="285" y="151" class="t">CLI Channel</text>
    <text x="285" y="172" class="s">oryxos chat</text>
    <rect x="440" y="125" width="210" height="60" rx="9" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="545" y="151" class="t">Web Service</text>
    <text x="545" y="172" class="s">REST API · /api/v1</text>
    <rect x="700" y="125" width="210" height="60" rx="9" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="805" y="151" class="t">AgentScheduler</text>
    <text x="805" y="172" class="s">cron 到点触发</text>
  </g>

  <!-- ==================== 统一入口 ==================== -->
  <text x="95" y="279" text-anchor="middle" class="lbl" fill="#1E293B">统一入口</text>
  <rect x="180" y="245" width="730" height="56" rx="10" fill="#1E293B"/>
  <text x="545" y="269" text-anchor="middle" class="tw">AgentService</text>
  <text x="545" y="290" text-anchor="middle" class="sw">process(Session, message) · 三个入口共用同一条链路</text>

  <!-- ==================== 引擎层 ==================== -->
  <rect x="35" y="350" width="890" height="100" rx="12" fill="#F5F3FF"/>
  <text x="95" y="396" text-anchor="middle" class="lbl" fill="#6D28D9">引擎层</text>
  <text x="95" y="415" text-anchor="middle" class="lbs">Agent 的大脑</text>
  <g text-anchor="middle">
    <rect x="180" y="365" width="210" height="70" rx="9" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="285" y="395" class="t">PromptBuilder</text>
    <text x="285" y="417" class="s">组装上下文与工具列表</text>
    <rect x="440" y="365" width="210" height="70" rx="9" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.4"/>
    <text x="545" y="395" class="t">ReActLoop</text>
    <text x="545" y="417" class="s">Reason → Act → Observe</text>
    <rect x="700" y="365" width="210" height="70" rx="9" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="805" y="395" class="t">ToolExecutor</text>
    <text x="805" y="417" class="s">沙箱校验 · 执行 · 审计</text>
  </g>

  <!-- ==================== 能力层 ==================== -->
  <rect x="35" y="500" width="890" height="110" rx="12" fill="#ECFDF5"/>
  <text x="95" y="551" text-anchor="middle" class="lbl" fill="#047857">能力层</text>
  <text x="95" y="570" text-anchor="middle" class="lbs">供养引擎</text>
  <g text-anchor="middle">
    <rect x="180" y="515" width="210" height="80" rx="9" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
    <text x="285" y="549" class="t">Memory</text>
    <text x="285" y="571" class="s">会话记忆 + MEMORY.md</text>
    <rect x="440" y="515" width="210" height="80" rx="9" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
    <text x="545" y="549" class="t">Provider</text>
    <text x="545" y="571" class="s">name → ChatModel 显式映射</text>
    <rect x="700" y="515" width="210" height="80" rx="9" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
    <text x="805" y="549" class="t">Tool</text>
    <text x="805" y="571" class="s">内置 · MCP · @Tool</text>
  </g>

  <!-- ==================== 基础层 ==================== -->
  <rect x="35" y="660" width="890" height="180" rx="12" fill="#F1F5F9"/>
  <text x="95" y="741" text-anchor="middle" class="lbl" fill="#334155">基础层</text>
  <text x="95" y="760" text-anchor="middle" class="lbs">配置 · 存储</text>
  <g text-anchor="middle">
    <rect x="180" y="675" width="210" height="64" rx="9" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3"/>
    <text x="285" y="703" class="t">AgentLoader</text>
    <text x="285" y="724" class="s">AGENT.md → Profile</text>
    <rect x="440" y="675" width="210" height="64" rx="9" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3"/>
    <text x="545" y="703" class="t">ContextLoader</text>
    <text x="545" y="724" class="s">Bootstrap · 正文 · Skill</text>
    <rect x="700" y="675" width="210" height="64" rx="9" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3"/>
    <text x="805" y="703" class="t">ConfigLoader</text>
    <text x="805" y="724" class="s">环境变量密钥注入</text>
    <rect x="180" y="760" width="470" height="64" rx="9" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3"/>
    <text x="415" y="788" class="t">SQLite · oryxos.db</text>
    <text x="415" y="809" class="s">会话 · 审计（llm_calls / tool_invocations）· 定时任务</text>
    <rect x="700" y="760" width="210" height="64" rx="9" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3"/>
    <text x="805" y="788" class="t">文件系统 · .oryxos/</text>
    <text x="805" y="809" class="s">agents · skills · MEMORY.md</text>
  </g>

  <!-- ==================== 外部系统 ==================== -->
  <text x="1080" y="476" text-anchor="middle" font-size="12.5" font-weight="700" fill="#B45309">外部系统</text>
  <g text-anchor="middle">
    <rect x="990" y="498" width="180" height="48" rx="9" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="1080" y="518" class="t">MCP Servers</text>
    <text x="1080" y="536" class="s">stdio · 任意语言</text>
    <rect x="990" y="562" width="180" height="48" rx="9" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="1080" y="582" class="t">企业 IM</text>
    <text x="1080" y="600" class="s">Webhook 通知</text>
    <rect x="990" y="675" width="180" height="64" rx="9" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="1080" y="703" class="t">LLM APIs</text>
    <text x="1080" y="724" class="s">DeepSeek · Kimi · 通义</text>
  </g>

  <!-- ==================== 连线 ==================== -->
  <!-- 触发者 → 接入层 -->
  <line class="ln" x1="285" y1="62" x2="285" y2="123" marker-end="url(#arr)"/>
  <line class="ln" x1="545" y1="62" x2="545" y2="123" marker-end="url(#arr)"/>
  <line class="ln" x1="805" y1="62" x2="805" y2="123" marker-end="url(#arr)"/>
  <!-- 接入层 → AgentService -->
  <line class="ln" x1="285" y1="185" x2="285" y2="243" marker-end="url(#arr)"/>
  <line class="ln" x1="545" y1="185" x2="545" y2="243" marker-end="url(#arr)"/>
  <line class="ln" x1="805" y1="185" x2="805" y2="243" marker-end="url(#arr)"/>
  <!-- AgentService → ReActLoop -->
  <line class="ln" x1="545" y1="301" x2="545" y2="363" marker-end="url(#arr)"/>
  <!-- 引擎内部 -->
  <line class="ln" x1="440" y1="400" x2="392" y2="400" marker-end="url(#arr)"/>
  <line class="ln" x1="650" y1="400" x2="698" y2="400" marker-end="url(#arr)"/>
  <!-- 能力层 ↔ 引擎层 -->
  <line class="ln" x1="285" y1="515" x2="285" y2="437" marker-end="url(#arr)"/>
  <line class="ln" x1="545" y1="437" x2="545" y2="513" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line class="ln" x1="805" y1="437" x2="805" y2="513" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <!-- 能力层 → 外部系统 -->
  <line class="lnExt" x1="910" y1="522" x2="988" y2="522" marker-end="url(#arrExt)"/>
  <line class="lnExt" x1="910" y1="586" x2="988" y2="586" marker-end="url(#arrExt)"/>
  <path class="lnExt" d="M545,595 L545,635 L1080,635 L1080,673" marker-end="url(#arrExt)"/>

  <!-- ==================== 图例 ==================== -->
  <g font-size="12" fill="#475569">
    <line class="ln" x1="40" y1="890" x2="76" y2="890" marker-end="url(#arr)"/>
    <text x="86" y="894">进程内调用</text>
    <line class="lnExt" x1="190" y1="890" x2="226" y2="890" marker-end="url(#arrExt)"/>
    <text x="236" y="894">跨越应用边界（经沙箱校验）</text>
    <text x="1170" y="894" text-anchor="end" fill="#94A3B8">所有 LLM 调用与 Tool 调用均落库审计</text>
  </g>
</svg>
